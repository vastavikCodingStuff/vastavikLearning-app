# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK.
android.useAndroidX=true
android.enableJetifier=true

# Firebase BOM version
firebaseBomVersion=33.1.2

# Kotlin version
kotlinVersion=2.0.20

# Compose Compiler version
composeCompilerVersion=2.0.20

# Compose BOM version
composeBomVersion=2024.12.00

# Hilt version
hiltVersion=2.52

# Coil version
coilVersion=2.6.0

# Navigation version
navigationVersion=2.8.4

# Lifecycle version
lifecycleVersion=2.8.4

# Coroutines version
coroutinesVersion=1.8.0

# Firebase Auth version
firebaseAuthVersion=23.0.0

# Firebase Firestore version
firebaseFirestoreVersion=25.0.0

# Firebase Storage version
firebaseStorageVersion=17.0.0

# Firebase Messaging version
firebaseMessagingVersion=24.0.0

# Google Sign In version
googleSignInVersion=8.6.0

